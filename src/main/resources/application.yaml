file:
  client-path: /file
  storage-location: /home/chanthat/file-upload/
  base-uri: http://localhost:${server.port}${file.client-path}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/realms/ecommerce
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${USERNAME}
    password: ${PASSWORD}
    url: ${URL}
  application:
    name: ite-ecomest
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
server:
  port: 9797
keycloak:
  server-url: http://localhost:9999
  client-id: ecommerce-spring
  client-secret: Wut4G4V361FCuGrrOYCJbc95CDqpy64g
  target-realm: ecommerce

